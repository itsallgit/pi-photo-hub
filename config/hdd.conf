# The photo HDD, pinned so another USB disk is never mounted at /mnt/photos instead (backlog B16).
# Read by scripts/mount-hdd.sh at every boot. HDD_UUID wins if both are set.
# A different or replaced HDD means editing this file (find the values with: lsblk -o NAME,LABEL,UUID,FSTYPE).
# The UUID identifies this one filesystem exactly; the label "Expansion" is the maker's default name,
# which a second drive of the same make would share.
HDD_UUID=5C40-0869
HDD_LABEL=Expansion
# How long to wait at boot for the disk to appear (a USB disk can be slow to spin up).
HDD_WAIT_SECONDS=90
