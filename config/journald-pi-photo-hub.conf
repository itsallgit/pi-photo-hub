# Installed to /etc/systemd/journald.conf.d/pi-photo-hub.conf by scripts/lib/apply-logging.sh
# (run by update.sh and bootstrap.sh). Overrides Storage=volatile in /etc/systemd/journald.conf.
# Keep service and kernel logs across reboots and power cuts, so a failure (or a shutdown that
# did not unmount the HDD cleanly) can be read afterwards: journalctl -b -1 (backlog B09).
# Capped so the SD card never fills.
[Journal]
Storage=persistent
SystemMaxUse=200M
SystemKeepFree=2G
