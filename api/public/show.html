<!doctype html>
<!-- The slideshow page (slideshow layer, B32). One page for every screen: the shelf screen opens it
     in kiosk mode (/show?kiosk=1); a phone or any browser opens /show and gets the controls on a tap.
     Every viewer follows the one slideshow on the Pi through /api/events (lockstep, R1). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<title>Photos</title>
<link rel="stylesheet" href="/show.css">
<link rel="stylesheet" href="/controls.css">
</head>
<body>
<div id="stage" aria-live="off"></div>
<div id="dim"></div>
<div id="card" class="hidden"><div class="card-title"></div><div class="card-dates"></div></div>
<div id="hud" class="hud"></div>
<div id="clock" class="clock hidden"></div>
<div id="status" class="hidden"></div>
<div id="pausemark" class="hidden" aria-hidden="true">❚❚</div>
<div id="toast" role="status"></div>
<div id="starmark" class="hidden" aria-label="Starred">★</div>
<div id="controls" class="hidden"></div>
<script src="/hud.js"></script>
<script src="/show.js"></script>
<script src="/map.js"></script>
<script src="/browse.js"></script>
<script src="/settings-ui.js"></script>
<script src="/controls.js"></script>
</body>
</html>
